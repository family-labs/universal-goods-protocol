name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (forge build and test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: foundry-rs/foundry-toolchain@v1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install Solidity dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: forge build

      - name: Test
        run: forge test

  packages:
    name: TypeScript packages (build and test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test
